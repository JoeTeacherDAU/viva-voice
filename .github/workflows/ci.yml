name: ci

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIVA_MOCK_ASR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/check-fixtures.mjs
      - run: node scripts/contrast-check.mjs
      - uses: astral-sh/setup-uv@v6
      - run: uv run --directory research pytest -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
