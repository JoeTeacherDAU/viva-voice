[project]
name = "viva-research"
version = "1.0.0"
description = "Viva Voice research layer: tier 2 and tier 3 features from the session archive"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
viva-research = "viva.export:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
